[DEFAULT]
debug = false
smtp_server = localhost
error_email_from = ckan@localhost

[app:main]
use = config:../ckan/test-core.ini

# Insert any custom config settings to be used when running your extension's
# tests here. These will override the one defined in CKAN core's test-core.ini
ckan.plugins = crc1153_specific_metadata  crc1153_layout crc1153_system_stats crc1153_dcat_profile crc1153_search

ckanext.dcat.rdf.profiles = euro_dcat_ap_2 crc1153_dcat_ap
ckanext.crc1153.mediawiki.scheme = https
ckanext.crc1153.mediawiki.host = smw.service.tib.eu
ckanext.crc1153.mediawiki.path = /wiki-sfb1153/
ckanext.crc1153.mediawiki.timeout = 30


# Logging configuration
[loggers]
keys = root, ckan, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_ckan]
qualname = ckan
handlers =
level = INFO

[logger_sqlalchemy]
handlers =
qualname = sqlalchemy.engine
level = WARN

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
